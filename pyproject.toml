[project]
name = "neuroai-cn"
version = "0.1.0"
description = "NeuroAI cross-pollination citation-network analysis (Phase 1: corpus + factions)"
authors = [
    { name = "Renato Duarte", email = "rcfduarte@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "duckdb>=1.1",
    "pyarrow>=18.0",
    "matplotlib>=3.9",
    "requests>=2.32",
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "igraph>=0.11",
    "leidenalg>=0.10",
    "ruptures>=1.1.10",
]

[project.optional-dependencies]
# Only needed to re-download the OpenAlex snapshot (scripts/download_snapshot.sh, works_incremental.sh).
snapshot = [
    "awscli>=1.34",
]
dev = [
    "ruff>=0.7",
    "pytest>=8.3",
    "pyyaml>=6.0",
    "ipython>=8.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neuroai_cn"]

[tool.pytest.ini_options]
markers = [
    "heavy: needs the OpenAlex DuckDB index or other large data outside the repository (deselect with -m 'not heavy')",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["docs", "notebooks", "_archive", "deprecated"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # mutable default arg (common in scientific code)
    "RUF001", # ambiguous unicode in strings (μ, α, β etc. in scientific code)
    "RUF002", # ambiguous unicode in docstrings
    "RUF003", # ambiguous unicode in comments
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
